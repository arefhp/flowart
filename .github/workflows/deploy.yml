name: deploy

# Builds the static site from the live API and deploys the Worker (API + static assets).
# Triggered by: the owner (manual), the Worker after an admin save (repository_dispatch
# "site-rebuild"), and a push to main once CI has passed.
# NOT yet exercised against a real Cloudflare account: that happens in Milestone 4 (runbook Step 10).

on:
  workflow_dispatch:
    inputs:
      allow_empty:
        description: 'FIRST deploy only: allow building before any API exists (empty site)'
        type: boolean
        default: false
  repository_dispatch:
    types: [site-rebuild]
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

# One deploy at a time; a newer request waits instead of cancelling a running deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # for workflow_run, only deploy when CI succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the static site from the live API
        env:
          BUILD_API_BASE_URL: https://zfadavi.com
          NEXT_PUBLIC_SITE_URL: https://zfadavi.com
          # public Turnstile site key: repository variable (Settings -> Secrets and variables -> Variables)
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          ALLOW_EMPTY_BUILD: ${{ inputs.allow_empty && '1' || '' }}
        run: npm run build

      - name: Deploy the Worker with the new site
        working-directory: apps/worker
        env:
          # repository secrets (not an approval environment: rebuilds must run unattended)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
