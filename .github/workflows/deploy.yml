name: deploy

# Builds the static site from the live API and deploys the Worker (API + static assets).
# Triggered by: the owner (manual) and the Worker after an admin save (repository_dispatch
# "site-rebuild"). The automatic deploy after a push to main is off until Milestone 4.
# It needs the real Cloudflare account to run (runbook Step 10); the smoke test at the end checks the live site.

on:
  workflow_dispatch:
    inputs:
      allow_empty:
        description: 'FIRST deploy only: allow building before any API exists (empty site)'
        type: boolean
        default: false
  repository_dispatch:
    types: [site-rebuild]
  # The automatic deploy after CI passes is switched OFF until production exists (Milestone 4, runbook
  # Step 10): with no live site yet, an automatic deploy could only fail. Re-enable by uncommenting:
  # workflow_run:
  #   workflows: [CI]
  #   branches: [main]
  #   types: [completed]

permissions:
  contents: read

# One deploy at a time; a newer request waits instead of cancelling a running deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # for workflow_run, only deploy when CI succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the public spam-check key is set
        # Without it the contact and booking forms cannot load the spam check and nothing can be sent.
        if: ${{ !inputs.allow_empty }}
        env:
          KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          test -n "$KEY" || { echo "::error::The repository variable NEXT_PUBLIC_TURNSTILE_SITE_KEY is empty. Add it under Settings > Secrets and variables > Actions > Variables (runbook Step 6)."; exit 1; }

      - name: Build the static site from the live API
        env:
          BUILD_API_BASE_URL: https://zfadavi.com
          NEXT_PUBLIC_SITE_URL: https://zfadavi.com
          # public Turnstile site key: repository variable (Settings -> Secrets and variables -> Variables)
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          ALLOW_EMPTY_BUILD: ${{ inputs.allow_empty && '1' || '' }}
        run: npm run build

      - name: Deploy the Worker with the new site
        working-directory: apps/worker
        env:
          # repository secrets (not an approval environment: rebuilds must run unattended)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test the live site
        # skipped on the very first (empty) deploy, when the domain may not be connected yet
        if: ${{ !inputs.allow_empty }}
        run: |
          for i in 1 2 3 4 5 6; do node scripts/smoke.mjs https://zfadavi.com && exit 0; echo "retrying in 20s"; sleep 20; done
          exit 1
