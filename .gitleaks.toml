# Default gitleaks rules plus one narrow exception.
# The Worker tests use obviously fake keys (for example sk_test_realvalue1234567890) so the code that
# recognises "a real-looking key" can be tested. They are not secrets. Everything else is still scanned.
title = "flowart"

[extend]
useDefault = true

[[allowlists]]
description = "fake keys used as fixtures in the Worker tests"
paths = [
  '''apps/worker/test/.*''',
  '''apps/worker/vitest\.config\.ts''',
]

# The Cloudflare Access application AUD tag is a public identifier, not a secret: the Worker uses it to
# check that a sign-in token was issued for THIS application, and it must sit in wrangler.jsonc.
# Only that one line of that one file is exempt.
[[allowlists]]
description = "Cloudflare Access AUD tag in wrangler.jsonc (public identifier)"
condition = "AND"
paths = ['''apps/worker/wrangler\.jsonc''']
regexTarget = "line"
regexes = ['''"ACCESS_AUD"\s*:''']
